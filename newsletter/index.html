<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter | PurgaTeam</title>
    <link rel="icon" type="image/png" href="../favicon-32x32.png">
    <link rel="stylesheet" href="../styles.css">
    <script>if (window.name === "purgateam-page-transition") document.documentElement.classList.add("page-transition-arriving");</script>
    <script src="../script.js" defer></script>
</head>
<body class="newsletter-page" data-asset-root="../">
    <div class="page-transition-overlay" aria-hidden="true"></div>

    <header>
        <div class="inner">
            <button class="primary-nav__toggle" type="button" aria-expanded="false" aria-controls="primary-nav-menu" aria-label="Open navigation">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </button>
            <nav class="primary-nav" id="primary-nav-menu">
                <ul>
                    <li><a href="../index.html" data-site-transition><span>Home</span></a></li>
                    <li><a href="../projects/index.html" data-site-transition><span>Projects</span></a></li>
                    <li><a href="index.html" aria-current="page"><span>Newsletter</span></a></li>
                    <li><a href="https://wiki.purgateam.com/" target="_blank" rel="noopener noreferrer"><span>Wikipedia</span></a></li>
                    <li><a href="https://www.patreon.com/c/PurgaTeam" target="_blank" rel="noopener noreferrer"><span>Patreon</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="secondary-header page-secondary-header">
        <span class="secondary-header__checker-clip" aria-hidden="true"><span class="secondary-header__checker-plane"></span></span>
        <img class="secondary-header__logo" src="../media/Images/PurgaTeam_Logo.png" alt="PurgaTeam">
        <nav class="secondary-header__socials" aria-label="Social media">
            <ul>
                <li><a href="https://www.youtube.com/@purgateam" target="_blank" rel="noopener noreferrer"><img class="social-icon--base" src="../media/SVGs/YouTube.svg" alt="YouTube"><img class="social-icon--hover" src="../media/SVGs/YouTube.svg" alt="" aria-hidden="true"></a></li>
                <li><a href="https://discord.gg/eR3pU9Sfu4" target="_blank" rel="noopener noreferrer"><img class="social-icon--base" src="../media/SVGs/Discord.svg" alt="Discord"><img class="social-icon--hover" src="../media/SVGs/Discord.svg" alt="" aria-hidden="true"></a></li>
                <li><a href="https://x.com/TeamPurga/" target="_blank" rel="noopener noreferrer"><img class="social-icon--base" src="../media/SVGs/Twitter.svg" alt="Twitter"><img class="social-icon--hover" src="../media/SVGs/Twitter.svg" alt="" aria-hidden="true"></a></li>
                <li><a href="https://bsky.app/profile/purgateam.bsky.social" target="_blank" rel="noopener noreferrer"><img class="social-icon--base" src="../media/SVGs/Bluesky.svg" alt="Bluesky"><img class="social-icon--hover" src="../media/SVGs/Bluesky.svg" alt="" aria-hidden="true"></a></li>
                <li><a href="https://www.instagram.com/purgateam_/" target="_blank" rel="noopener noreferrer"><img class="social-icon--base" src="../media/SVGs/Instagram.svg" alt="Instagram"><img class="social-icon--hover" src="../media/SVGs/Instagram.svg" alt="" aria-hidden="true"></a></li>
                <li><a href="https://www.tiktok.com/@purgateam_" target="_blank" rel="noopener noreferrer"><img class="social-icon--base" src="../media/SVGs/TikTok.svg" alt="TikTok"><img class="social-icon--hover" src="../media/SVGs/TikTok.svg" alt="" aria-hidden="true"></a></li>
                <li><a href="https://www.reddit.com/r/PurgaTeam/" target="_blank" rel="noopener noreferrer"><img class="social-icon--base" src="../media/SVGs/Reddit.svg" alt="Reddit"><img class="social-icon--hover" src="../media/SVGs/Reddit.svg" alt="" aria-hidden="true"></a></li>
            </ul>
        </nav>
        <span class="secondary-header__edge-outline secondary-header__edge-outline--light" aria-hidden="true"></span>
        <span class="secondary-header__edge-outline secondary-header__edge-outline--dark" aria-hidden="true"></span>
        <span class="secondary-header__edge-texture" aria-hidden="true"></span>
    </section>

    <main class="newsletter-main">
        <section class="newsletter-archive" aria-labelledby="newsletter-title">
            <div class="newsletter-archive__texture" aria-hidden="true"></div>
            <header class="newsletter-archive__heading">
                <h1 id="newsletter-title">Newsletter</h1>
            </header>

            <div class="newsletter-carousel">
                <button class="newsletter-carousel__arrow newsletter-carousel__arrow--previous" type="button" aria-label="Show previous newsletters" data-newsletter-previous hidden>
                    <span aria-hidden="true">&lsaquo;</span>
                </button>

                <div class="newsletter-carousel__viewport" data-newsletter-viewport>
                    <div class="newsletter-archive__grid" id="newsletter-grid"></div>
                </div>

                <button class="newsletter-carousel__arrow newsletter-carousel__arrow--next" type="button" aria-label="Show more newsletters" data-newsletter-next hidden>
                    <span aria-hidden="true">&rsaquo;</span>
                </button>
            </div>
        </section>
    </main>

    <div class="footer-shell">
        <footer>
            <div class="footer__inner">
                <img class="footer__logo" src="../media/Images/PurgaTeam_Logo.png" alt="PurgaTeam">
                <p class="footer__years">2024-2026</p>
                <address class="footer__inquiries">
                    <span>Inquiries?</span>
                    <a href="mailto:purgateamcontact@gmail.com">purgateamcontact@gmail.com</a>
                </address>
            </div>
        </footer>
    </div>
</body>
</html>
