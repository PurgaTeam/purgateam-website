name: Sync Patreon newsletters

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync newsletters
        env:
          PATREON_CREATOR_ACCESS_TOKEN: ${{ secrets.PATREON_CREATOR_ACCESS_TOKEN }}
        run: |
          if [ -z "$PATREON_CREATOR_ACCESS_TOKEN" ]; then
            exit 0
          fi
          node tools/sync-patreon-newsletters.mjs
      - name: Commit updates
        run: |
          if git diff --quiet -- newsletter/patreon-posts.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter/patreon-posts.json
          git commit -m "Sync Patreon newsletters"
          git push
